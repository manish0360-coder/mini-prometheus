[project]
name = "mini-prometheus"
version = "0.4.0"
description = "AI Manufacturing Intelligence — runtime orchestration platform integrating MiniFlyWire, Noetica, and Velith."
requires-python = ">=3.11"

# Mini Prometheus consumes Velith (engineering entry point) and, transitively, Noetica
# (platform mechanisms) as PINNED versioned package dependencies — exact frozen releases,
# never floating ranges. MiniFlyWire is NEVER a dependency (Law 4). Uncomment and pin as
# each frozen release is published (Velith is at M0–M1; a consumable release is a gate).
dependencies = [
    "jsonschema>=4.18",   # runtime contract validation at MP boundaries (verification-first)
    # "velith==<frozen-version>",
    # "noetica==<frozen-version>",
]

[project.optional-dependencies]
# Toolchain PINNED for reproducibility and ecosystem consistency with Velith (same lint/type/test
# family, pinned to exact patch versions — no floating ranges). The local venv and the Docker verifier
# install this exact set, so a verdict is identical on the workstation and in the container.
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-jsonschema",            # jsonschema stubs — `mypy src` is type-clean with these present
    "import-linter==2.13",         # enforces contracts-only cross-boundary dependency direction
    "datamodel-code-generator==0.71.0",  # regenerates contracts/python bindings from schemas
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Target standard, mirroring Velith's rule set. NOTE: the existing RM1–RM3 source predates any ruff
# standard (long lines, unsorted imports), so `ruff check`/`ruff format` are NOT yet green. A one-time
# `ruff format` + `ruff check --fix` normalization is a separate, tracked chore; until then the
# verifier's blocking gate is `pytest` + `mypy src` (both green).
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mini_prometheus", "contracts"]

# ----------------------------------------------------------------------------
# mypy: pragmatic config; `mypy src` is clean today. Tightening to strict + tests is a follow-up
# (the test helpers use a dict(...)+** idiom mypy rejects). No pydantic plugin — MP uses dataclasses.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "."]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true

# Dependency direction is one-way: implementations -> contracts.
# Never contracts -> implementations; never src <-> src across packages except via contracts.
[tool.importlinter]
root_packages = ["mini_prometheus"]

[[tool.importlinter.contracts]]
name = "MiniFlyWire is never imported (Law 4)"
type = "forbidden"
source_modules = ["mini_prometheus"]
forbidden_modules = ["miniflywire"]

[[tool.importlinter.contracts]]
name = "Content packages do not import orchestration/integrations/intake (peers; arch §14)"
type = "forbidden"
source_modules = [
    "mini_prometheus.manufacturing_planning",
    "mini_prometheus.manufacturing_constraints",
]
forbidden_modules = [
    "mini_prometheus.orchestration",
    "mini_prometheus.integrations",
    "mini_prometheus.intake",
]

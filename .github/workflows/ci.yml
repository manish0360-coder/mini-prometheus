# CI is the machine enforcement of the frozen Engineering Workflow verification gate (RM1 + RM2).
# Stages: contract-drift -> contract-freeze -> RM1 zero-diff -> lint -> import-linter -> tests -> boundary.
# Non-skippable; red blocks merge. Do not weaken gates.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags, so the RM1 zero-diff gate can diff against rm1-complete

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Contracts are generated, not hand-edited (drift check)
        run: |
          python tools/generate_contracts.py
          git diff --exit-code -- contracts/python \
            || (echo "contracts/python is stale — regenerate from schemas" && exit 1)

      - name: Contract suite frozen (RM2 must not change contracts)
        run: |
          test "$(cat contracts/VERSION)" = "0.2.0" \
            || (echo "contracts/VERSION changed — RM2 must not modify contracts" && exit 1)

      - name: RM1 + contracts unchanged (zero-diff vs rm1-complete)
        run: |
          git diff --exit-code rm1-complete -- \
            src/mini_prometheus/_contracts.py \
            src/mini_prometheus/_hashing.py \
            src/mini_prometheus/_validate.py \
            src/mini_prometheus/_provenance.py \
            src/mini_prometheus/_verifier.py \
            src/mini_prometheus/intake \
            src/mini_prometheus/manufacturing_planning \
            src/mini_prometheus/manufacturing_constraints \
            src/mini_prometheus/orchestration/__init__.py \
            src/mini_prometheus/orchestration/runner.py \
            src/mini_prometheus/orchestration/episode_store.py \
            contracts/ \
            || (echo "RM1 or contracts changed — RM1 is frozen" && exit 1)

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Boundary / dependency-direction (import-linter)
        run: lint-imports

      - name: Unit + contract-compliance + integration + boundary tests
        run: pytest -q

      - name: Boundary DAG (no MiniFlyWire import; Law 4)
        run: pytest -q tests/boundary
